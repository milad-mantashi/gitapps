name: Standalone DEB
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_deb.py --standalone
      - run: |
          sudo apt install ./dist/gitapps_*_amd64.deb -y
          /usr/bin/gitapps --version
          /usr/bin/gitapps --help
      - uses: actions/upload-artifact@v4
        with:
          name: gitapps-standalone-deb-amd64
          path: dist/*_amd64.deb
      - name: Attach packages to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upload_release.py
