name: Standalone DEB
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_deb.py --standalone
      - run: |
          sudo apt install ./dist/gitapps_*_amd64.deb -y
          /usr/bin/gitapps --version
          /usr/bin/gitapps --help
      - uses: actions/upload-artifact@v4
        with:
          name: gitapps-standalone-deb-amd64
          path: dist/*_amd64.deb
